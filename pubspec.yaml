name: 'Ageo_solutions'
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  flutter_svg: ^2.0.10+1
  retry: ^3.1.2
  flutter_secure_storage: ^9.0.0
  syncfusion_flutter_charts: ^26.2.10
  omni_datetime_picker: ^2.0.3
  persistent_bottom_nav_bar_v2: ^5.3.0
  provider: ^6.1.2
  flutter_localization: ^0.2.1
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  lucide_icons: ^0.257.0
  jwt_decoder: ^2.0.1
  custom_sliding_segmented_control: ^1.8.3
  cached_network_image: ^3.4.1
  flutter_vlc_player: ^7.4.2
  local_auth: ^2.3.0
  intl: ^0.19.0
 
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
flutter_icons: 
  android: true
  ios: true
  image_path: 'assets/icons/logo_ageo.svg'
  adaptive_icon_background: '#ffffff'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
